<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket Bot Manager - لوحة التحكم</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            padding: 2rem;
            background-color: #1e293b;
            border-radius: 1rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            border: 1px solid #334155;
        }
        h1 {
            color: #38bdf8;
            margin-bottom: 1rem;
        }
        p {
            color: #94a3b8;
            font-size: 1.1rem;
        }
        .status {
            display: inline-block;
            margin-top: 1.5rem;
            padding: 0.5rem 1rem;
            background-color: #065f46;
            color: #34d399;
            border-radius: 9999px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Ticket Bot Manager</h1>
        <p>مرحباً بك في لوحة تحكم بوت التذاكر الخاص بك.</p>
        <p>هذا الخادم يعمل الآن بنجاح.</p>
        <div class="status">الحالة: متصل</div>
    </div>
</body>
</html>
